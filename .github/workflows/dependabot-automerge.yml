# Generated by HarnessEngineering services/dependabot.
#
# Merges Dependabot patch/minor PRs once every other check on the PR (CI,
# Vercel preview, ...) has passed. Major updates are left for a human.
#
# Does not rely on branch protection: this job waits for the other checks
# itself. If the PR has no other checks at all, it refuses to merge — an
# update nothing has verified should wait for a human.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the other checks, then merge patch/minor updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          SELF: ${{ github.workflow }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *)
              echo "Update type '$UPDATE_TYPE' is not patch/minor — leaving this PR for manual review."
              exit 0
              ;;
          esac

          grace=$((SECONDS + 5 * 60))
          deadline=$((SECONDS + 40 * 60))
          while :; do
            checks=$(gh pr checks "$PR_URL" --json name,bucket,workflow 2>/dev/null || true)
            others=$(jq --arg self "$SELF" '[.[] | select(.workflow != $self)]' <<<"${checks:-[]}")
            total=$(jq length <<<"$others")
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$others")
            failed=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$others")

            if [ "$failed" -gt 0 ]; then
              echo "::error::Checks failed — not merging. Fix the incompatibility or merge manually."
              jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | "  - \(.name)"' <<<"$others"
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              break
            fi
            if [ "$total" -eq 0 ] && [ "$SECONDS" -ge "$grace" ]; then
              echo "::error::No other checks ran on this PR, so nothing verified the update — not merging. Add CI to this repo, or review and merge manually."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for checks — not merging."
              exit 1
            fi
            sleep 30
          done

          echo "All $total other checks passed — merging $UPDATE_TYPE."
          gh pr merge "$PR_URL" --squash
