name: Database Migrations

# supabase/migrations/ を Supabase CLI で本番に適用する。
#
# 手作業で SQL Editor に貼る運用では「流し忘れ」「別プロジェクトに流した」を
# 誰も検出できない。CLI は適用済みバージョンを本番の履歴テーブルに記録するため、
# 何が未適用かが常に確定する。
#
# - プルリクエスト: --dry-run で「何が適用されるか」だけ表示（DBは変更しない）
# - main へのマージ: 実際に適用
# - 手動実行: list（適用状況の確認） / push / repair（初回の移行用）
#
# 必要なシークレット:
#   SUPABASE_ACCESS_TOKEN  (既存・Edge Functionのデプロイで使用中)
#   SUPABASE_PROJECT_ID    (既存)
#   SUPABASE_DB_PASSWORD   (要追加: Supabaseのデータベースパスワード)

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-push.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      action:
        description: '実行する操作'
        type: choice
        options: [list, push, repair]
        default: list
      repair_versions:
        description: 'repair時のみ: 適用済みとして記録するバージョン（空白区切り）'
        default: '20240101000000 20240102000000 20240103000000 20240104000000 20240105000000 20240106000000 20240107000000 20240108000000 20240109000000 20240110000000'

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "${PROJECT_REF:-}" ]           && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "${DB_PASSWORD:-}" ]           && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::シークレットが未設定です:$missing"
            echo "リポジトリの Settings → Secrets and variables → Actions で追加してください。"
            exit 1
          fi
          echo "必要なシークレットは揃っています"

      # 適用状況の確認。どのバージョンが本番に入っているかが一覧で出る。
      - name: List migration status
        run: supabase migration list --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      # プルリクエストでは実際には流さず、適用されるものだけ見せる
      - name: Dry run (pull request)
        if: github.event_name == 'pull_request'
        run: supabase db push --project-ref "$PROJECT_REF" --password "$DB_PASSWORD" --dry-run

      # main にマージされたら実際に適用する
      - name: Apply migrations
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'push')
        run: supabase db push --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      # 初回移行用: 手作業で適用済みのマイグレーションを「適用済み」として履歴に記録する。
      # これをしないと db push が既に流したものを再実行しようとする。
      - name: Repair migration history (one-time bootstrap)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'repair'
        env:
          # 入力をスクリプトに直接展開せず環境変数で渡す（インジェクション対策）
          VERSIONS: ${{ inputs.repair_versions }}
        run: |
          set -euo pipefail
          versions="$VERSIONS"
          if [ -z "$versions" ]; then
            echo "::error::repair_versions が空です"
            exit 1
          fi
          echo "適用済みとして記録します: $versions"
          # shellcheck disable=SC2086
          supabase migration repair --status applied \
            --project-ref "$PROJECT_REF" --password "$DB_PASSWORD" $versions
          echo "── 記録後の状態 ──"
          supabase migration list --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
