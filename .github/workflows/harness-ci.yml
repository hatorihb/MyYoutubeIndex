# Generated by HarnessEngineering services/ci.
#
# Every pull request and push to main gets:
#   - node / python: each project found in the repo (monorepo subdirectories
#     included) installs from its lockfile and runs the same gate as Claude's
#     Stop hook — typecheck / lint / test where the project defines them.
#   - harness-hooks: secret-scan / content-check over the files a PR changes.
#   - actionlint: the repo's workflow definitions.
# Dependabot auto-merge waits for these checks; they are what makes an
# unattended merge verified. Logic lives in .github/harness-ci/*.sh.
name: Harness CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.find.outputs.node }}
      python: ${{ steps.find.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: bash .github/harness-ci/detect.sh >> "$GITHUB_OUTPUT"

  node:
    needs: detect
    if: needs.detect.outputs.node != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.node) }}
    env:
      DIR: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          v="lts/*"
          for f in .nvmrc .node-version; do
            if [ -f "$DIR/$f" ]; then v=$(head -1 "$DIR/$f" | tr -d '[:space:]'); break; fi
          done
          echo "node=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.version.outputs.node }}
      - run: bash .github/harness-ci/node.sh "$DIR"

  python:
    needs: detect
    if: needs.detect.outputs.python != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.python) }}
    env:
      DIR: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          v="3.x"
          if [ -f "$DIR/.python-version" ]; then v=$(head -1 "$DIR/.python-version" | tr -d '[:space:]'); fi
          echo "python=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.version.outputs.python }}
      - run: bash .github/harness-ci/python.sh "$DIR"

  harness-hooks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/harness-ci/hooks.sh "$BASE"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint (workflow syntax, expressions, action inputs)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          # Embedded shellcheck/pyflakes off: style findings in existing
          # workflows shouldn't turn CI red on the day it is installed.
          ./actionlint -color -shellcheck= -pyflakes=
